name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fork-guard:
    # The secrets and the shared runner are not for fork code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "A maintainer must push this branch to the repo to run the tests."
          exit 1

  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: gobb
        ports:
          # A random host port, bound to localhost: the runner is shared.
          - "127.0.0.1::5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit-message scan reads the whole history.
          fetch-depth: 0
          # No step needs git credentials, and branch code runs later.
          persist-credentials: false

      - name: Scope the Go caches to this run
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "GOMODCACHE=$RUNNER_TEMP/gomod-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Public-repo guards
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
        run: |
          if [ -z "$PUBLIC_DENYLIST" ]; then
            echo "PUBLIC_DENYLIST secret is empty"
            exit 1
          fi
          umask 077
          # Branch code runs in later steps. Do not leave the list on disk.
          trap 'rm -f "$RUNNER_TEMP/denylist"' EXIT
          printf '%s\n' "$PUBLIC_DENYLIST" > "$RUNNER_TEMP/denylist"
          status=0
          DENYLIST_FILE="$RUNNER_TEMP/denylist" sh scripts/check-public.sh || status=$?
          # Local hooks can be bypassed, so scan every commit message too.
          msgs="$RUNNER_TEMP/commit-messages.txt"
          git log --format='%H%n%B' > "$msgs"
          DENYLIST_FILE="$RUNNER_TEMP/denylist" sh scripts/check-public.sh "$msgs" || status=$?
          # Plain mode: a scissors line in one message must not hide the rest.
          sh scripts/refuse-session-ids.sh "$msgs" || status=$?
          echo "guards: tree and commit messages scanned, status $status"
          exit "$status"

      - name: Format, vet, staticcheck, govulncheck
        run: |
          status=0
          note() { [ "$status" -ne 0 ] || status=$1; }
          # The shell runs with -e. Capture each status so no tool stops the rest.
          fmt_status=0
          out=$(gofmt -l . 2>&1) || fmt_status=$?
          if [ "$fmt_status" -ne 0 ] || [ -n "$out" ]; then
            echo "gofmt: these files need formatting, or gofmt failed:"
            echo "$out"
            note "$fmt_status"
            note 1
          fi
          go vet ./... || note $?
          go tool staticcheck ./... || note $?
          go tool govulncheck ./... || note $?
          exit "$status"

      - name: Test
        env:
          GOBB_TEST_DATABASE_URL: postgres://postgres:gobb@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: |
          status=0
          go test -race -json ./... > test.json 2> test.err || status=$?
          if [ "$status" -ne 0 ]; then
            echo "go test failed with status $status; output follows."
            cat test.err
            grep -F '"Output":"' test.json \
              | sed -n 's/,"OutputType":"[a-z-]*"//; s/.*"Output":"\(.*\)"}$/\1/p' \
              | sed 's/\\n/\n/g; s/\\t/\t/g; s/\\"/"/g'
          fi
          # A package with no test files also emits a skip event, but with no
          # "Test" field. Only a skipped test counts.
          if grep -F '"Action":"skip"' test.json | grep -q -F '"Test":'; then
            echo "unexpected skipped test"
            grep -F '"Action":"skip"' test.json | grep -F '"Test":'
            exit 1
          fi
          echo "tests: $(grep -c '"Action":"pass"' test.json) pass events, no skips"
          exit "$status"

      # The module cache is read-only; make it writable so rm can remove it.
      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/denylist" "$RUNNER_TEMP/commit-messages.txt"
          chmod -R u+w "$GOMODCACHE" 2>/dev/null || true
          rm -rf "$GOMODCACHE" "$GOCACHE"

  # Each fuzz target runs for 60 s on every push. It runs after check, so a plain
  # test failure shows first. A failing input is written to testdata/fuzz in the
  # package of the target, and the job uploads that folder. Add the input to the
  # repo and fix the cause before you land.
  fuzz:
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scope the Go caches to this run
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "GOMODCACHE=$RUNNER_TEMP/gomod-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # scripts/fuzz.sh lists each target first and fails when the name matches no
      # fuzz test (go test alone exits 0 with a warning, so a renamed target would
      # pass with nothing fuzzed). One run reports every target. -run '^$' skips
      # the unit tests, which the check job ran.
      - name: Fuzz each target for 60 seconds
        run: |
          sh scripts/fuzz.sh 60s \
            "./markup/ FuzzParse" \
            "./markup/ FuzzRender" \
            "./internal/password/ FuzzVerifyLegacy" \
            "./internal/avatar/ FuzzMake"

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failing-inputs
          path: |
            markup/testdata/fuzz
            internal/password/testdata/fuzz
            internal/avatar/testdata/fuzz
          if-no-files-found: ignore

      # The module cache is read-only; make it writable so rm can remove it.
      - name: Clean up
        if: always()
        run: |
          chmod -R u+w "$GOMODCACHE" 2>/dev/null || true
          rm -rf "$GOMODCACHE" "$GOCACHE"

  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      # Every name carries the run ID and the attempt: the runner is shared.
      IMAGE: gobb:ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_PROJECT_NAME: gobb-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # compose.yaml tags the image it builds as ghcr.io/evanwtf/gobb:$GOBB_VERSION.
      GOBB_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: ci
      # The commit that the build line of every page shows. docker build and
      # compose.yaml pass it as the GOBB_COMMIT build argument.
      GOBB_COMMIT: ${{ github.sha }}
      # Every compose command uses the CI port override and the 256 MiB cap.
      COMPOSE_FILE: compose.yaml:.github/compose.ci.yaml:.github/compose.memcap.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The backup round trip below runs scripts/rowcounts with Go.
      - name: Scope the Go caches to this run
        shell: bash
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "GOMODCACHE=$RUNNER_TEMP/gomod-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Build the exact production target, then run it.
      - name: Build the image and run it
        run: |
          docker build --build-arg GOBB_COMMIT="$GOBB_COMMIT" -t "$IMAGE" .
          out=$(docker run --rm "$IMAGE" version)
          echo "$out"
          [ "$out" = "gobb 0.1.0" ]

      # --wait returns once postgres and gobb both report healthy.
      - name: Start the stack
        run: |
          docker compose up -d --build --wait
          port=$(docker compose port gobb 8080)
          curl -fsS "http://$port/healthz"

      # The negative case: on a database with no board, the script must fail at the
      # first URL, on the 503 of an empty board. A script that passes here checks
      # nothing, and a curl failure also exits 1, so the step wants the line too.
      - name: Smoke script fails on an empty board
        run: |
          port=$(docker compose port gobb 8080)
          status=0
          sh scripts/smoke-serve.sh "http://$port" > "$RUNNER_TEMP/smoke-empty.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/smoke-empty.txt"
          line=0
          grep -q -x -F 'FAIL /: want status 200, got 503' "$RUNNER_TEMP/smoke-empty.txt" || line=1
          rm -f "$RUNNER_TEMP/smoke-empty.txt"
          [ "$status" = 1 ] || { echo "want exit status 1 on an empty board, got $status"; exit 1; }
          [ "$line" = 0 ] || { echo "want the line 'FAIL /: want status 200, got 503'"; exit 1; }

      # gobb reads the legacy routes and the stored hashes once at start, so it
      # stops for the import and starts again on the loaded board. Before the
      # start, bob and carol get a 64 MiB argon2id hash for the burst step below.
      - name: Import the example bundle
        run: |
          docker compose stop gobb
          docker compose run --rm -v "$PWD/docs/example-bundle:/import:ro" gobb import /import
          out=$(docker compose exec -T postgres psql -U gobb -d gobb -v ON_ERROR_STOP=1 < .github/memcap-hashes.sql)
          echo "$out"
          [ "$out" = "UPDATE 2" ] || { echo "want UPDATE 2 for the 64 MiB hashes"; exit 1; }
          docker compose up -d --wait
          # The start-up lines: the memory limit from the cgroup of the cap, and
          # a charge of 64 MiB, two checks at once.
          logs=$(docker compose logs --no-color gobb)
          echo "$logs" | grep -E 'memory limit|password check charge|sign-in floor'
          echo "$logs" | grep -q -F 'limit_bytes=187904819 source=cgroup gate_budget_kib=131072' ||
            { echo "want the memory limit from the cgroup: 70% of 256 MiB, and a 128 MiB gate"; exit 1; }
          echo "$logs" | grep -q -F 'kib=65536 checks_at_once=2' ||
            { echo "want a charge of 65536 KiB, two checks at once"; exit 1; }

      # The build line of a page names the commit that CI built: the first 8
      # characters of github.sha. A guest sees the time and no query count (only an
      # admin sees the count). /t/99 is a 404, which shows the build only.
      - name: The footer names the commit
        run: |
          port=$(docker compose port gobb 8080)
          want=$(printf '%.8s' "$GOBB_COMMIT")
          case "$want" in
            *[!0-9a-f]* | "") echo "GOBB_COMMIT does not start with 8 hex characters"; exit 1 ;;
          esac
          [ "${#want}" = 8 ] || { echo "GOBB_COMMIT is shorter than 8 characters"; exit 1; }
          for path in / /t/1 /t/99; do
            line=$(curl -sS "http://$port$path" | sed -n 's|.*<p class="build-line">\([^<]*\)</p>.*|\1|p')
            echo "$path: $line"
            case "$line" in
              *" · build $want") ;;
              *) echo "$path: the build line does not end with build $want"; exit 1 ;;
            esac
            case "$line" in
              *quer*) echo "$path: a guest sees a query count"; exit 1 ;;
            esac
            if [ "$path" = /t/99 ]; then
              # A 404 shows the plain line: no time.
              case "$line" in
                "gobb "*) ;;
                *) echo "$path: a 404 shows a time"; exit 1 ;;
              esac
            else
              # A 2xx GET shows the time, and no count, to a guest.
              case "$line" in
                "Rendered in "*" s · gobb "*) ;;
                *) echo "$path: a guest page shows no time"; exit 1 ;;
              esac
            fi
          done

      - name: Serve pages under the memory cap
        run: |
          port=$(docker compose port gobb 8080)
          sh scripts/smoke-serve.sh "http://$port"
          cid=$(docker compose ps -q gobb)
          docker inspect -f 'limit={{.HostConfig.Memory}} swap={{.HostConfig.MemorySwap}}' "$cid"
          [ "$(docker inspect -f '{{.HostConfig.Memory}}' "$cid")" = 268435456 ]
          state=$(docker inspect -f '{{.RestartCount}} {{.State.OOMKilled}}' "$cid")
          echo "restarts and OOM kill: $state"
          [ "$state" = "0 false" ]
          docker stats --no-stream --format 'docker stats now: {{.MemUsage}} ({{.MemPerc}})' "$cid"
          # The peak of the container, from its cgroup (v2), before the stop. The
          # path depends on the cgroup driver of Docker: systemd or cgroupfs.
          id=$(docker inspect -f '{{.Id}}' "$cid")
          dir=
          for d in "/sys/fs/cgroup/system.slice/docker-$id.scope" "/sys/fs/cgroup/docker/$id"; do
            if [ -r "$d/memory.peak" ] && [ -r "$d/memory.events" ]; then
              dir=$d
              break
            fi
          done
          if [ -n "$dir" ]; then
            peak=$(cat "$dir/memory.peak")
            oom=$(awk '$1 == "oom_kill" { print $2 }' "$dir/memory.events")
            echo "cgroup path used: $dir"
            echo "memory.peak: $peak bytes ($((peak / 1048576)) MiB)"
            echo "memory.events oom_kill: $oom"
            [ "$oom" = 0 ] || { echo "the kernel killed a process in the container"; exit 1; }
          else
            echo "cgroup memory.peak is not readable on this runner (tried the systemd and cgroupfs paths); the docker stats line above is the only memory figure"
          fi

      # The memory test of the cap. Forty wrong passwords, 20 at a time, against
      # the two 64 MiB hashes: each try comes from its own address, and each
      # name takes 20 of them, the limit per name, so every try runs a 64 MiB
      # check. Without a Go memory limit, the heap can grow to twice the memory
      # in use, and the kernel can kill gobb. A restart clears the sign-in
      # limits, so a kill fails the step.
      - name: A burst of wrong passwords under the memory cap
        run: |
          port=$(docker compose port gobb 8080)
          cid=$(docker compose ps -q gobb)
          status=0
          sh scripts/login-burst.sh "http://$port" 40 20 bob carol || status=$?
          state=$(docker inspect -f '{{.RestartCount}} {{.State.OOMKilled}}' "$cid")
          echo "restarts and OOM kill: $state"
          docker stats --no-stream --format 'docker stats now: {{.MemUsage}} ({{.MemPerc}})' "$cid"
          [ "$state" = "0 false" ] || { echo "gobb restarted or the kernel killed it"; exit 1; }
          [ "$status" = 0 ] || exit 1
          # The cgroup (v2) of the container: its peak must stay under the cap,
          # and the kernel must have killed nothing. A restart makes a new
          # cgroup, so the restart count above is the check that sees a kill.
          id=$(docker inspect -f '{{.Id}}' "$cid")
          dir=
          for d in "/sys/fs/cgroup/system.slice/docker-$id.scope" "/sys/fs/cgroup/docker/$id"; do
            if [ -r "$d/memory.peak" ] && [ -r "$d/memory.events" ]; then
              dir=$d
              break
            fi
          done
          [ -n "$dir" ] || { echo "cgroup memory.peak is not readable on this runner"; exit 1; }
          peak=$(cat "$dir/memory.peak")
          oom=$(awk '$1 == "oom_kill" { print $2 }' "$dir/memory.events")
          echo "cgroup path used: $dir"
          echo "memory.peak: $peak bytes ($((peak / 1048576)) MiB)"
          echo "memory.events oom_kill: $oom"
          [ "$oom" = 0 ] || { echo "the kernel killed a process in the container"; exit 1; }
          [ "$peak" -lt 268435456 ] || { echo "memory.peak reached the 256 MiB cap"; exit 1; }

      # The backup and the restore of the README ("Back up and upgrade"). The step
      # runs the commands that the README shows: scripts/readme-block.sh takes each
      # block from the file, so the README cannot drift from what CI proves.
      #
      # 1. Back up with gobb running, as the README says.
      # 2. Stop gobb, restore the dump into a copy (gobb_check), and compare the row
      #    counts of the live database with the copy: the dump is complete.
      # 3. Add a table to the live database. It stands in for a table of a newer
      #    migration, and it has a foreign key to users, which `pg_restore --clean`
      #    could not drop.
      # 4. Run the restore with each input broken in turn: the restore must exit
      #    non-zero and delete nothing, neither the database nor the data volume.
      # 5. Run the restore for real. The extra table must be gone, every row count
      #    (schema_migrations too) must equal the copy, and the data volume must
      #    hold the same files. Then gobb must start on the restored board.
      - name: Back up and restore, and compare the row counts
        shell: bash
        run: |
          umask 077
          export BACKUP_DIR="$RUNNER_TEMP/backups-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$BACKUP_DIR"
          trap 'rm -rf "$BACKUP_DIR"' EXIT
          # Run a block of the README in this shell.
          block() {
            local text
            text=$(sh scripts/readme-block.sh "$1") || return 1
            eval "$text"
          }
          sql() { docker compose exec -T postgres psql -U gobb -v ON_ERROR_STOP=1 -tA "$@"; }
          hostport=$(docker compose port postgres 5432)
          dsn() { echo "postgres://gobb:$POSTGRES_PASSWORD@$hostport/$1?sslmode=disable"; }
          counts() { GOBB_SOURCE_DSN=$(dsn "$1") GOBB_RESTORED_DSN=$(dsn "$2") go run ./scripts/rowcounts; }
          # The number of files in the data volume of the gobb container.
          files() {
            docker run --rm --volumes-from "$(docker compose ps -aq gobb)" \
              --entrypoint sh postgres:18 -c 'find /var/lib/gobb -type f | wc -l'
          }

          # The Restore section sets BACKUP_DIR itself, because a new shell has none.
          # That line is outside every block, so this step does not run it: it would
          # replace the folder of this step.
          awk '/^### Restore/ { on = 1; next } /^##+ / { on = 0 } on' README.md \
            | grep -F -x 'export BACKUP_DIR="$HOME/gobb-backups"' > /dev/null \
            || { echo "the Restore section of the README does not set BACKUP_DIR"; exit 1; }

          # 1. Back up.
          export STAMP
          STAMP=$(date +%Y%m%d-%H%M%S)
          good=$STAMP
          block dump
          block archive
          block check
          [ -s "$BACKUP_DIR/gobb-$good.dump" ] || { echo "the dump is missing or empty"; exit 1; }
          [ -s "$BACKUP_DIR/gobb-data-$good.tar.gz" ] || { echo "the archive is missing or empty"; exit 1; }

          # 2. The dump holds what the live database holds.
          docker compose stop gobb
          sql -d postgres -c 'create database gobb_check'
          docker compose exec -T postgres pg_restore -U gobb -d gobb_check --exit-on-error < "$BACKUP_DIR/gobb-$good.dump"
          counts gobb gobb_check
          before=$(files)
          echo "files in the data volume: $before"
          [ "$before" -gt 0 ] || { echo "the data volume is empty, so a deleted volume would not show"; exit 1; }

          # 3. A table of a newer migration.
          sql -d gobb -c 'create table newer_table (id int primary key, user_id int references users (id))' -c 'insert into newer_table (id) values (1)'

          # 4. Each broken input must stop the restore before it deletes anything.
          # The second argument is the message that the failed check must print on
          # stderr, so a restore that stops in silence fails this step.
          refuses() {
            local why=$1 want=$2 status=0 err="$BACKUP_DIR/refusal.err"
            block restore 2> "$err" || status=$?
            cat "$err" >&2
            [ "$status" -ne 0 ] || { echo "the restore passed with $why"; exit 1; }
            grep -F -- "$want" "$err" > /dev/null || { echo "$why: the restore did not print \"$want\""; exit 1; }
            rm -f "$err"
            [ "$(sql -d gobb -c 'select count(*) from newer_table')" = 1 ] || { echo "$why: the restore dropped the database"; exit 1; }
            [ "$(files)" = "$before" ] || { echo "$why: the restore changed the data volume"; exit 1; }
            echo "refused with $why, and deleted nothing"
          }
          # A stamp with a dump and no archive is newer than the good one. The picker
          # must skip it.
          bad=29990101-000000
          cp "$BACKUP_DIR/gobb-$good.dump" "$BACKUP_DIR/gobb-$bad.dump"
          block restore-pick
          [ "$STAMP" = "$good" ] || { echo "the picker chose $STAMP, want $good"; exit 1; }
          STAMP=$bad
          refuses "the archive missing" "no archive for $bad in $BACKUP_DIR"
          STAMP=
          refuses "an empty STAMP" "STAMP is empty"
          printf 'not a dump' > "$BACKUP_DIR/gobb-$bad.dump"
          cp "$BACKUP_DIR/gobb-data-$good.tar.gz" "$BACKUP_DIR/gobb-data-$bad.tar.gz"
          STAMP=$bad
          refuses "a dump that pg_restore cannot read" "pg_restore cannot read the dump for $bad"
          cp "$BACKUP_DIR/gobb-$good.dump" "$BACKUP_DIR/gobb-$bad.dump"
          printf 'not an archive' > "$BACKUP_DIR/gobb-data-$bad.tar.gz"
          refuses "an archive that tar cannot read" "tar cannot read the archive for $bad"
          rm -f "$BACKUP_DIR/gobb-$bad.dump" "$BACKUP_DIR/gobb-data-$bad.tar.gz"

          # 5. The restore.
          block restore-pick
          [ "$STAMP" = "$good" ] || { echo "the picker chose $STAMP, want $good"; exit 1; }
          block restore
          [ -z "$(sql -d gobb -c "select to_regclass('public.newer_table')")" ] || { echo "newer_table survived the restore"; exit 1; }
          counts gobb_check gobb
          [ "$(files)" = "$before" ] || { echo "the data volume differs after the restore"; exit 1; }
          docker compose up -d --wait
          port=$(docker compose port gobb 8080)
          curl -fsS "http://$port/healthz"
          sh scripts/smoke-serve.sh "http://$port"

      # Compose gives gobb a 30 s grace period. A clean stop must end well inside
      # it, with exit code 0 (137 means Docker sent SIGKILL).
      - name: Stop gobb cleanly
        run: |
          cid=$(docker compose ps -q gobb)
          start=$(date +%s.%N)
          docker compose stop gobb
          end=$(date +%s.%N)
          code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          took=$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.1f", e - s }')
          echo "stop took $took s, exit code $code"
          [ "$code" = 0 ] || { echo "want exit code 0"; exit 1; }
          awk -v t="$took" 'BEGIN { exit !(t < 25) }' || { echo "the stop took 25 s or more"; exit 1; }

      - name: Show the logs after a failure
        if: failure()
        run: docker compose logs --no-color || true

      # Leave no containers, volumes, networks or images on the shared runner.
      - name: Clean up
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          docker image rm "$IMAGE" "ghcr.io/evanwtf/gobb:$GOBB_VERSION" || true
          chmod -R u+w "$GOMODCACHE" 2>/dev/null || true
          rm -rf "$GOMODCACHE" "$GOCACHE"
