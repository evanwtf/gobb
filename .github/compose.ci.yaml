# CI override for compose.yaml. The runner is shared, so a run must not claim a
# fixed host port or the pinned subnet.
services:
  postgres:
    # The round-trip step of CI counts rows from the runner, over localhost.
    ports:
      - "127.0.0.1::5432"
  gobb:
    ports: !override
      - "127.0.0.1::8080"
    environment:
      # The network below has no fixed subnet, so the address of the gateway is
      # not known in advance. Trust every IPv4 peer as a proxy: the burst step of
      # CI sends each sign-in from its own IPv6 address in X-Forwarded-For. Never
      # use this value for a deployment.
      GOBB_TRUSTED_PROXIES: "0.0.0.0/0"

networks:
  default:
    ipam: !reset {}
