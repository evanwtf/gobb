# Local mirror of CI. Install with:
#   uvx pre-commit install --hook-type pre-commit --hook-type commit-msg
# Without this, every hook also runs at the commit-msg stage.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      # The data guard runs first, before any hook can rewrite a file.
      - id: check-public
        name: check-public
        entry: scripts/check-public.sh
        language: script
        pass_filenames: true
      # At commit-msg, pre-commit passes the message file. --commit-msg makes the
      # guard drop git's comments and the verbose diff first.
      - id: check-public-msg
        name: check-public (commit message)
        entry: scripts/check-public.sh --commit-msg
        language: script
        pass_filenames: true
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        # --unsafe parses the syntax only. It accepts the !override and !reset
        # tags in .github/compose.ci.yaml.
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: refuse-session-ids
        name: refuse-session-ids
        entry: scripts/refuse-session-ids.sh --commit-msg
        language: script
        stages: [commit-msg]
