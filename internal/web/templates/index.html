{{define "content"}}
<h1 class="visually-hidden">Board index</h1>
{{range .Data.Groups}}
<section class="category{{if not .Title}} untitled{{end}}"{{if .Title}} aria-labelledby="cat-{{.Forum.ID}}"{{end}}>
  <div class="bar">
    {{- if .Title}}<h2 id="cat-{{.Forum.ID}}"><a href="{{path "f" (printf "%d" .Forum.ID)}}">{{.Title}}</a></h2>{{end -}}
  </div>
  {{- if .Rows}}
  {{template "forumtable" rows .Rows $.Viewer.Loc}}
  {{- else}}
  <p class="empty">There are no forums here yet.</p>
  {{- end}}
</section>
{{else}}
<p class="empty standalone">There are no forums to show.</p>
{{end}}
{{end}}
